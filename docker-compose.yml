services:
  financeiro-whatsapp:
    build: .
    container_name: sistema-financeiro-whatsapp
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_PATH=/app/data/financeiro.db
      - EVOLUTION_API_URL=${EVOLUTION_API_URL}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
      - EVOLUTION_INSTANCE=${EVOLUTION_INSTANCE}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ALLOWED_NUMBERS=${ALLOWED_NUMBERS:-}
    volumes:
      - financeiro-data:/app/data

volumes:
  financeiro-data:
